<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06080C">
<title>ELYSIUM · Connexion</title>
<meta name="description" content="Connecte-toi à ton espace membre Elysium.">
<meta name="robots" content="noindex">
<script>document.documentElement.classList.add('js')</script>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/oswald-600-normal-latin.woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="cur" aria-hidden="true"></div><div class="curdot" aria-hidden="true"></div>

<div class="qtop" style="position:fixed;top:0;left:0;right:0;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:16px var(--edge)">
  <a class="logo" href="index.html" aria-label="Elysium · Nutrition & Performance"><span class="elg"><svg class="elg-ring" viewBox="0 0 300 300" fill="none" aria-hidden="true"><defs><linearGradient id="egt" x1="0.1" x2="0.9"><stop offset="0" stop-color="#e3edfb"/><stop offset=".55" stop-color="#2E9BFF"/><stop offset="1" stop-color="#7ea6df"/></linearGradient><linearGradient id="egb" x1="0.1" x2="0.9"><stop offset="0" stop-color="#2E9BFF"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><path d="M23 104A135 135 0 0 1 277 104" stroke="url(#egt)" stroke-width="2.6" stroke-linecap="round"/><path d="M277 196A135 135 0 0 1 23 196" stroke="url(#egb)" stroke-width="2.6" stroke-linecap="round"/></svg><span class="elg-name">Elysium</span><span class="elg-sub"><i class="l"></i>Nutrition <b>&amp;</b> Performance<i class="r"></i></span></span></a>
  <a class="back" href="inscription.html" style="font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);text-decoration:none">Créer un compte ›</a>
</div>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="kick">Espace membre</div>
    <h1>Content de te<span class="l2">revoir.</span></h1>
    <p class="sub">Connecte-toi pour retrouver ton espace, ton suivi et ton programme.</p>
    <form class="auth-form" id="login">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn">Se connecter</button>
    </form>
    <p class="auth-msg" id="msg" role="alert"></p>
    <p class="auth-alt">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    <p class="auth-alt" style="margin-top:10px"><a href="#" id="forgot">Mot de passe oublié ?</a></p>
  </div>
</main>


<script src="assets/site.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/ely-auth.js"></script>
<script>
(function(){
  var f=document.getElementById('login'), msg=document.getElementById('msg');
  var btn=f.querySelector('button[type=submit]'), label=btn.textContent;

  function say(txt,kind){ msg.textContent=txt; msg.className='auth-msg on '+(kind||'err'); }
  function clear(){ msg.className='auth-msg'; }

  // Messages Supabase (anglais) -> français clair, sans révéler si le compte existe.
  function human(err){
    var m=((err&&err.message)||'').toLowerCase();
    if(m.indexOf('invalid login')>-1)   return "Email ou mot de passe incorrect.";
    if(m.indexOf('email not confirmed')>-1) return "Ton adresse n'est pas encore confirmée : clique sur le lien reçu par e-mail.";
    if(m.indexOf('rate limit')>-1||m.indexOf('too many')>-1) return "Trop de tentatives. Réessaie dans quelques minutes.";
    if(m.indexOf('failed to fetch')>-1||m.indexOf('network')>-1) return "Connexion au serveur impossible. Vérifie ta connexion internet.";
    return "Connexion impossible pour le moment. Réessaie dans un instant.";
  }

  f.addEventListener('submit',function(e){
    e.preventDefault(); clear();
    btn.disabled=true; btn.textContent='Connexion…';
    ElyAuth.login(f.email.value, f.password.value)
      .then(function(){ location.href='espace.html'; })
      .catch(function(err){ say(human(err)); btn.disabled=false; btn.textContent=label; });
  });

  document.getElementById('forgot').addEventListener('click',function(e){
    e.preventDefault(); clear();
    var mail=(f.email.value||'').trim();
    if(!mail){ say("Saisis d'abord ton adresse e-mail ci-dessus, puis reclique."); return; }
    ElyAuth.resetPassword(mail).then(function(){
      say("Si un compte existe pour "+mail+", un lien de réinitialisation vient d'être envoyé.","ok");
    }).catch(function(){ say("Envoi impossible pour le moment. Réessaie dans un instant."); });
  });
})();
</script>
</body>
</html>
